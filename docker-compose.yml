services:
  postgres:
    image: postgres:16-alpine
    container_name: atrium-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atrium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atrium_password}
      POSTGRES_DB: ${POSTGRES_DB:-atrium}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atrium-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api1:
    build:
      context: ./backend
    container_name: atrium-api-1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://atrium:atrium_password@postgres:5432/atrium?schema=public}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      INSTANCE_ID: api-1
      PAYGATE_CHAOS: ${PAYGATE_CHAOS:-off}
    expose:
      - "3000"
    networks:
      - atrium-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api2:
    build:
      context: ./backend
    container_name: atrium-api-2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://atrium:atrium_password@postgres:5432/atrium?schema=public}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      INSTANCE_ID: api-2
      PAYGATE_CHAOS: ${PAYGATE_CHAOS:-off}
    expose:
      - "3000"
    networks:
      - atrium-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api3:
    build:
      context: ./backend
    container_name: atrium-api-3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:-postgresql://atrium:atrium_password@postgres:5432/atrium?schema=public}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      INSTANCE_ID: api-3
      PAYGATE_CHAOS: ${PAYGATE_CHAOS:-off}
    expose:
      - "3000"
    networks:
      - atrium-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    container_name: atrium-nginx
    depends_on:
      api1:
        condition: service_healthy
      api2:
        condition: service_healthy
      api3:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - atrium-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    container_name: atrium-web
    depends_on:
      nginx:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - atrium-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  atrium-net:
    driver: bridge
